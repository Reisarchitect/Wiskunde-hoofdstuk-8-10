<body>
<div style="position:fixed;top:0;left:0;right:0;background:#10b981;color:white;padding:6px;text-align:center;font-size:12px;font-family:sans-serif;z-index:9999;">Trainer v8 - vieringen per proefwerk. Zie je deze groene balk niet? Dan is het cache. Doe Ctrl+F5.</div>
<div class="app" id="app" style="margin-top:32px;">Laden...</div>
<noscript><div style="padding:40px;text-align:center;color:#b91c1c;background:#fee2e2;">JavaScript staat uit. Schakel JavaScript in om de trainer te gebruiken.</div></noscript>
<div id="errorBox" style="display:none;background:#fee2e2;color:#991b1b;padding:16px;margin:16px;border-radius:8px;font-family:monospace;white-space:pre-wrap;font-size:12px;"></div>
<script>
window.addEventListener('error', function(ev){
  var box = document.getElementById('errorBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = 'JS ERROR: ' + ev.message + '\n bij regel ' + ev.lineno + ', kolom ' + ev.colno + '\n bestand: ' + ev.filename + '\n\nstack: ' + (ev.error && ev.error.stack ? ev.error.stack : '(geen stack)');
});
// ============================
// HELPER: Opgaven naar platte vragenlijst
// ============================
function buildVragen(opgaven) {
  const out = [];
  opgaven.forEach((op, opIdx) => {
    op.sub.forEach((sv, svIdx) => {
      out.push({
        opgaveNr: opIdx + 1,
        opgaveTitel: op.titel || ('Opgave ' + (opIdx + 1)),
        intro: op.intro,
        label: sv.label || String.fromCharCode(97 + svIdx),
        vraag: sv.vraag,
        type: sv.type,
        opties: sv.opties,
        juist: sv.juist,
        antwoord: sv.antwoord,
        alts: sv.alts,
        hint: sv.hint,
        uitleg: sv.uitleg
      });
    });
  });
  return out;
}

// ============================
// DATA: Modules (verhalende opgaven met sub-vragen)
// ============================
const MODULES = [
  {
    id: 11, chapter: 'H9.1', title: 'Omtrek cirkel',
    desc: 'Omtrek = diameter × π',
    uitleg: `
      <div class="leerdoel"><strong>Je leert in deze paragraaf:</strong>
        <ul>
          <li>de relatie tussen diameter, straal en omtrek van een cirkel</li>
          <li>de formule voor de omtrek van een cirkel</li>
          <li>de omtrek berekenen als je diameter of straal kent</li>
          <li>de diameter berekenen als je de omtrek kent</li>
        </ul>
      </div>
      <div class="theorie"><strong>Theorie</strong>
        <p>De <strong>diameter</strong> (d) is de lijn dwars door het midden van de cirkel. De <strong>straal</strong> (r) is van het midden tot de rand. Dus: <span class="formula">diameter = 2 × straal</span>, of <span class="formula">straal = diameter : 2</span>.</p>
        <p>Voor elke cirkel geldt: <strong>omtrek : diameter = π</strong>. En π (pi) ≈ <span class="formula">3,14</span>.</p>
        <p>Daaruit volgt de formule die je UIT JE HOOFD moet kennen:</p>
        <p style="text-align:center;font-size:18px;margin:8px 0;"><span class="formula">omtrek = diameter × π</span></p>
        <p>Of, als je alleen de straal hebt: <span class="formula">omtrek = 2 × straal × π</span>.</p>
      </div>
      <div class="stappen"><strong>Aanpak: omtrek berekenen</strong><ol>
        <li>Kijk wat je hebt: diameter of straal?</li>
        <li>Heb je de straal, reken eerst diameter uit (r × 2).</li>
        <li>Vermenigvuldig diameter met π (≈ 3,14).</li>
        <li>Schrijf de eenheid erbij (cm, m, ...).</li>
      </ol></div>
      <div class="stappen"><strong>Aanpak: diameter berekenen uit omtrek</strong><ol>
        <li>Gebruik dezelfde formule andersom: <span class="formula">diameter = omtrek : π</span></li>
        <li>Deel de omtrek door 3,14.</li>
      </ol></div>
      <div class="voorbeeld"><strong>Voorbeeld 1</strong><br>
        <span class="stap">Een wiel heeft diameter 70 cm.</span>
        <span class="stap">Omtrek = 70 × π ≈ 70 × 3,14 = 219,8 cm.</span>
        <span class="stap">In één omwenteling legt het wiel 219,8 cm af.</span>
      </div>

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { moduleScores: {}, moduleAnswers: {}, testScores: {}, testAnswers: {} };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();if (!state.moduleAnswers) state.moduleAnswers = {};
let view = { screen: 'home', moduleId: null, testId: null, qIndex: 0, tab: 'uitleg', selected: null, checked: false, hint: false, testInputs: {} };

function normalize(s) {
  return String(s).toLowerCase()
    .replace(/\s+/g,'')
    .replace(/×/g,'')
    .replace(/\*/g,'')
    .replace(/·/g,'')
    .replace(/−/g,'-')
    .replace(/,/g,'.');
}
function checkAnswer(input, vraag) {
  const norm = normalize(input);
  // Exacte match
  if (vraag.alts && vraag.alts.length) {
    if (vraag.alts.some(a => normalize(a) === norm)) return true;
  } else if (normalize(vraag.antwoord) === norm) {
    return true;
  }
  // Numerieke match met tolerantie (voor afrondingsverschillen)
  const userNum = parseFloat(norm.replace('-','-').replace(',','.'));
  const expectedNum = parseFloat(normalize(vraag.antwoord).replace(',','.'));
  if (!isNaN(userNum) && !isNaN(expectedNum)) {
    // Tolerantie: 0.05 (vangt verschillen door π=3,14 vs 3,1416)
    const diff = Math.abs(userNum - expectedNum);
    if (diff <= 0.05) return true;
  }
  return false;
}
function getModuleProgress(mId) {
  const s = state.moduleScores[mId] || {};
  const m = MODULES.find(x => x.id === mId);
  const total = m.vragen.length;
  const done = Object.keys(s).length;
  const correct = Object.values(s).filter(x => x).length;
  return { total, done, correct };
}
function getTotalProgress() {
  let totalQ = 0, totalC = 0;
  MODULES.forEach(m => {
    const p = getModuleProgress(m.id);
    totalQ += p.total;
    totalC += p.correct;
  });
  return { totalQ, totalC };
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const app = document.getElementById('app');
  if (view.screen === 'home') app.innerHTML = renderHome();
  else if (view.screen === 'module') app.innerHTML = renderModule();
  else if (view.screen === 'test') app.innerHTML = renderTest();
  else if (view.screen === 'testResult') app.innerHTML = renderTestResult();
  attachListeners();
}

function renderPrevSubvragen(m, currentIdx) {
  const v = m.vragen[currentIdx];
  const prev = [];
  for (let i = 0; i < currentIdx; i++) {
    if (m.vragen[i].opgaveNr === v.opgaveNr) prev.push({ idx: i, v: m.vragen[i] });
  }
  if (!prev.length) return '';
  const answers = state.moduleAnswers[m.id] || {};
  const scores = state.moduleScores[m.id] || {};
  let html = '<div class="prev-answers"><div style="font-weight:600;color:#6b21a8;margin-bottom:4px;font-size:12px;">Wat je al hebt gedaan in deze opgave:</div>';
  prev.forEach(function(item) {
    const idx = item.idx, pv = item.v;
    const ans = answers[idx];
    const correct = scores[idx];
    const correctAns = pv.type === 'mc' ? (pv.opties[pv.juist]) : pv.antwoord;
    const userDisplay = pv.type === 'mc' ? (ans !== undefined && ans !== null ? pv.opties[Number(ans)] : '?') : (ans || '?');
    const cls = correct === true ? 'correct' : correct === false ? 'wrong' : '';
    html += `<div class="pa-item ${cls}"><span class="lbl">${pv.label})</span>`;
    if (cls === 'correct') {
      html += `<span class="ans">${escapeHtml(String(userDisplay))}</span>`;
    } else if (cls === 'wrong') {
      html += `<span class="ans">${escapeHtml(String(userDisplay))}</span><span class="correct-ans">→ ${escapeHtml(String(correctAns))}</span>`;
    } else {
      html += `<span style="color:#94a3b8;">(nog niet beantwoord)</span>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

function renderQuestion(m) {
  const idx = view.qIndex;
  const v = m.vragen[idx];
  const isMC = v.type === 'mc';
  let html = `
    <div class="opgave-header">
      <div class="label">${v.opgaveTitel}</div>
      <div class="opgave-intro">${v.intro}</div>
    </div>
    ${renderPrevSubvragen(m, idx)}
    <div class="question-card">
      <div class="question-counter">Vraag ${idx + 1} van ${m.vragen.length}</div>
      <div class="sub-vraag-label">${v.label})</div>
      <div class="question-text">${v.vraag}</div>
  `;
  if (isMC) {
    html += `<div class="mc-options">`;
    v.opties.forEach((opt, i) => {
      let cls = 'mc-option';
      if (view.checked) {
        if (i === v.juist) cls += ' correct';
        else if (i === view.selected) cls += ' wrong';
      } else if (view.selected === i) cls += ' selected';
      html += `<button class="${cls}" data-action="selectMC" data-idx="${i}" ${view.checked ? 'disabled' : ''}>${escapeHtml(opt)}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<input class="answer-input" id="answerInput" type="text" placeholder="Typ je antwoord" value="${view.selected ?? ''}" ${view.checked ? 'disabled' : ''} autocomplete="off">`;
  }

  if (view.hint) {
    html += `<div class="hint-box"><strong>Hint:</strong> ${v.hint || 'Geen hint beschikbaar.'}</div>`;
  }

  if (view.checked) {
    const correct = view.lastCorrect;
    html += `<div class="feedback ${correct ? 'correct' : 'wrong'}">
      <strong>${correct ? 'Goed!' : 'Niet helemaal.'}</strong>
      ${correct ? '' : `<div class="answer-shown">Juiste antwoord: <strong>${escapeHtml(v.antwoord || v.opties[v.juist])}</strong></div>`}
      <div>${v.uitleg || ''}</div>
    </div>`;
  }

  html += `<div class="btn-row">`;
  if (!view.checked) {
    html += `<button class="btn" data-action="check">Controleer</button>`;
    if (!view.hint) html += `<button class="btn btn-secondary btn-small" data-action="hint">Hint</button>`;
  } else {
    if (idx < m.vragen.length - 1) html += `<button class="btn" data-action="next">Volgende</button>`;
    else html += `<button class="btn" data-action="home">Klaar! terug naar overzicht</button>`;
    html += `<button class="btn btn-secondary btn-small" data-action="retry">Opnieuw</button>`;
  }
  if (idx > 0 && !view.checked) html += `<button class="btn btn-secondary btn-small" data-action="prev">Vorige</button>`;
  html += `</div></div>`;
  return html;
}

function renderTest() {
  const t = PROEFWERKEN.find(x => x.id === view.testId);

  `;
  let lastOpgave = -1;
  t.vragen.forEach((v, i) => {
    const isMC = v.type === 'mc';
    if (v.opgaveNr !== lastOpgave) {
      html += `<div class="opgave-header" style="margin-top:18px;">

        <div class="opgave-intro">${v.intro || ''}</div>

        const sel = view.testInputs[i] === String(oi);

    }

  html += `<div class="btn-row"><button class="btn" data-action="submitTest">Lever in</button></div>`;

function renderTestResult() {
  const t = PROEFWERKEN.find(x => x.id === view.testId);
  const answers = state.testAnswers[t.id] || [];
  let score = 0;
  t.vragen.forEach((v, i) => {
    if (v.type === 'mc') {
      if (String(v.juist) === answers[i]) score++;
    } else {
      if (answers[i] && checkAnswer(answers[i], v)) score++;
    }
  });
  const grade = Math.round((score / t.vragen.length) * 10 * 10) / 10;
  const gradeClass = grade >= 7 ? 'good' : grade >= 5.5 ? 'mid' : 'low';
  const msg = grade >= 8 ? 'Top gedaan! je beheerst de stof.' : grade >= 6.5 ? 'Goed bezig! kijk welke je nog kan verbeteren.' : grade >= 5.5 ? 'Bijna voldoende. oefen de modules waar je vragen mist.' : 'Niet erg. terug naar de module-uitleg en opnieuw.';
  let html = `
    <button class="back-btn" data-action="home">&larr; Terug naar overzicht</button>
    <div class="card">
      <h2>${t.title}</h2>
      <div class="test-result">
        <div style="font-size:14px;color:#64748b;">Je score</div>
        <div class="grade ${gradeClass}">${grade}</div>
        <div style="font-size:14px;color:#64748b;">${score} van ${t.vragen.length} goed</div>
        <div class="msg">${msg}</div>
      </div>
      <h3>Overzicht van alle vragen</h3>
  `;
  t.vragen.forEach((v, i) => {
    const userAns = answers[i] || '(leeg)';
    let correct = false;
    let userDisplay = userAns;
    if (v.type === 'mc') {
      correct = String(v.juist) === answers[i];
      userDisplay = answers[i] !== undefined && answers[i] !== '' ? v.opties[Number(answers[i])] : '(leeg)';
    } else {
      correct = answers[i] && checkAnswer(answers[i], v);
    }
    const juistDisplay = v.type === 'mc' ? v.opties[v.juist] : v.antwoord;
    html += `<div class="review-item ${correct ? '':'wrong'}">
      <div class="q">${v.opgaveTitel} - ${v.label}) ${v.vraag}</div>
      <div class="a">Jouw antwoord: <strong>${escapeHtml(userDisplay)}</strong>${correct ? '' : ` | Juist: <strong>${escapeHtml(juistDisplay)}</strong>`}</div>
      ${!correct && v.uitleg ? `<div class="a" style="margin-top:4px;font-style:italic;">${v.uitleg}</div>` : ''}
    </div>`;
  });
  html += `<div class="btn-row">
    <button class="btn" data-action="retakeTest">Probeer opnieuw</button></button>
    <button class="btn btn-secondary" data-action="home">Terug naar overzicht</button>
  </div></div>`;
  if (grade >= VIERING_CONFIG.drempel && !view.vieringGesloten) {
    html += renderVuurwerk(grade);
  }
  return html;
}

function renderVuurwerk(grade) {
  function sparks(idx) {
    let s = '';
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const dx = Math.cos(angle) * 80;
      const dy = Math.sin(angle) * 80;
      s += `<span style="--dx:${dx}px;--dy:${dy}px;animation-delay:${idx*0.4}s"></span>`;
    }
    return s;
  }
  // Pak per-proefwerk tekst, of fallback
  const pw = VIERING_CONFIG.per_proefwerk && VIERING_CONFIG.per_proefwerk[view.testId];
  const titel = pw ? pw.titel : VIERING_CONFIG.default_titel;
  const tekst = pw ? pw.tekst : VIERING_CONFIG.default_tekst;
  let fotoHtml = '';
  if (VIERING_CONFIG.foto_url && VIERING_CONFIG.foto_url.trim()) {
    fotoHtml = `<img src="${escapeHtml(VIERING_CONFIG.foto_url)}" alt="Viering">`;
  } else if (VIERING_CONFIG.emoji) {
    fotoHtml = escapeHtml(VIERING_CONFIG.emoji);
  }
  return `
    <div class="viering-overlay" data-action="sluitViering">
      <div class="vuurwerk vw1">${sparks(0)}</div>
      <div class="vuurwerk vw2">${sparks(1)}</div>
      <div class="vuurwerk vw3">${sparks(2)}</div>
      <div class="vuurwerk vw4">${sparks(3)}</div>
      <div class="vuurwerk vw5">${sparks(4)}</div>
      <div class="viering-card" onclick="event.stopPropagation()">
        <h1>${escapeHtml(titel)}</h1>
        <div class="cijfer-display">${grade}</div>
        ${fotoHtml ? `<div class="foto-plek">${fotoHtml}</div>` : ''}
        ${tekst ? `<div class="tekst">${escapeHtml(tekst)}</div>` : ''}
        <button class="sluit-btn" data-action="sluitViering">Sluiten</button>
      </div>
    </div>
  `;
}

function attachListeners() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleClick);
  });
  document.querySelectorAll('input[data-action="testInput"]').forEach(el => {
    el.addEventListener('input', e => {
      const q = Number(e.target.dataset.q);
      view.testInputs[q] = e.target.value;
    });
  });
  const ai = document.getElementById('answerInput');
  if (ai) {
    ai.focus();
    ai.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (!view.checked) doCheck();
        else doNext();
      }
    });
    ai.addEventListener('input', e => { view.selected = e.target.value; });
  }
}

function handleClick(e) {
  const a = e.currentTarget.dataset.action;
  if (a === 'home') goHome();
  else if (a === 'openModule') openModule(Number(e.currentTarget.dataset.id));
  else if (a === 'openTest') openTest(Number(e.currentTarget.dataset.id));
  else if (a === 'tab') { view.tab = e.currentTarget.dataset.tab; view.qIndex = 0; resetQState(); render(); }
  else if (a === 'check') doCheck();
  else if (a === 'next') doNext();
  else if (a === 'prev') doPrev();
  else if (a === 'retry') { resetQState(); render(); }
  else if (a === 'hint') { view.hint = true; render(); }
  else if (a === 'selectMC') { view.selected = Number(e.currentTarget.dataset.idx); render(); }
  else if (a === 'testMC') { view.testInputs[Number(e.currentTarget.dataset.q)] = e.currentTarget.dataset.i; render(); }
  else if (a === 'submitTest') submitTest();
  else if (a === 'retakeTest') { view.vieringGesloten = false; openTest(view.testId); }
  else if (a === 'sluitViering') { view.vieringGesloten = true; render(); }
  else if (a === 'reset') doReset();
}

function resetQState() {
  view.selected = null;
  view.checked = false;
  view.hint = false;
  view.lastCorrect = false;
}
function goHome() { view.screen = 'home'; render(); }
function openModule(id) {
  view.screen = 'module';
  view.moduleId = id;
  view.tab = 'uitleg';
  view.qIndex = 0;
  resetQState();
  render();
}
function openTest(id) {
  view.screen = 'test';
  view.testId = id;
  view.testInputs = {};
  view.vieringGesloten = false;
  render();
}
function doCheck() {
  const m = MODULES.find(x => x.id === view.moduleId);
  const v = m.vragen[view.qIndex];
  let correct = false;
  if (v.type === 'mc') {
    if (view.selected === null) return;
    correct = view.selected === v.juist;
  } else {
    if (view.selected === null || String(view.selected).trim() === '') return;
    correct = checkAnswer(view.selected, v);
  }
  view.checked = true;
  view.lastCorrect = correct;
  if (!state.moduleScores[m.id]) state.moduleScores[m.id] = {};
  if (!state.moduleAnswers[m.id]) state.moduleAnswers[m.id] = {};
  state.moduleScores[m.id][view.qIndex] = correct;
  state.moduleAnswers[m.id][view.qIndex] = view.selected;
  saveState();
  render();
}
function doNext() {
  const m = MODULES.find(x => x.id === view.moduleId);
  if (view.qIndex < m.vragen.length - 1) {
    view.qIndex++;
    resetQState();
    render();
  }
}
function doPrev() {
  if (view.qIndex > 0) {
    view.qIndex--;
    resetQState();
    render();
  }
}
function submitTest() {
  const t = PROEFWERKEN.find(x => x.id === view.testId);
  const answers = [];
  t.vragen.forEach((v, i) => { answers[i] = view.testInputs[i] || ''; });
  state.testAnswers[t.id] = answers;
  let score = 0;
  t.vragen.forEach((v, i) => {
    if (v.type === 'mc') {
      if (String(v.juist) === answers[i]) score++;
    } else {
      if (answers[i] && checkAnswer(answers[i], v)) score++;
    }
  });
  state.testScores[t.id] = score;
  saveState();
  view.vieringGesloten = false;
  view.screen = 'testResult';
  render();
}
function doReset() {
  if (confirm('Weet je het zeker? Alle voortgang wordt gewist.')) {
    state = { moduleScores: {}, moduleAnswers: {}, testScores: {}, testAnswers: {} };
    saveState();
    render();
  }
}

try { render(); } catch(e) {
  var box = document.getElementById('errorBox');
  if (box) { box.style.display = 'block'; box.textContent = 'INIT ERROR: ' + e.message + '\n\n' + (e.stack || ''); }
}
</script>
</body>
</html>
