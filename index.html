<body>
<div style="position:fixed;top:0;left:0;right:0;background:#10b981;color:white;padding:6px;text-align:center;font-size:12px;font-family:sans-serif;z-index:9999;">Trainer v3 - gebouwd 31 mei. Zie je deze groene balk niet? Dan is het cache. Doe Ctrl+F5.</div>
<div class="app" id="app" style="margin-top:32px;">Laden...</div>
<noscript><div style="padding:40px;text-align:center;color:#b91c1c;background:#fee2e2;">JavaScript staat uit. Schakel JavaScript in om de trainer te gebruiken.</div></noscript>
<div id="errorBox" style="display:none;background:#fee2e2;color:#991b1b;padding:16px;margin:16px;border-radius:8px;font-family:monospace;white-space:pre-wrap;font-size:12px;"></div>
<script>
window.addEventListener('error', function(ev){
  var box = document.getElementById('errorBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = 'JS ERROR: ' + ev.message + '\n bij regel ' + ev.lineno + ', kolom ' + ev.colno + '\n bestand: ' + ev.filename + '\n\nstack: ' + (ev.error && ev.error.stack ? ev.error.stack : '(geen stack)');
});
// ============================
// HELPER: Opgaven naar platte vragenlijst
// ============================
function buildVragen(opgaven) {
  const out = [];
  opgaven.forEach((op, opIdx) => {
    op.sub.forEach((sv, svIdx) => {
      out.push({
        opgaveNr: opIdx + 1,
        opgaveTitel: op.titel || ('Opgave ' + (opIdx + 1)),
        intro: op.intro,
        label: sv.label || String.fromCharCode(97 + svIdx),
        vraag: sv.vraag,
        type: sv.type,
        opties: sv.opties,
        juist: sv.juist,
        antwoord: sv.antwoord,
        alts: sv.alts,
        hint: sv.hint,
        uitleg: sv.uitleg
      });
    });
  });
  return out;
}

// ============================
// DATA: Modules (verhalende opgaven met sub-vragen)
// ============================
const MODULES = [
  {
    id: 1, chapter: 'H8.1', title: 'Gelijksoortige termen',
    desc: 'Termen met dezelfde letter samenvoegen',
    uitleg: `
      <div class="leerdoel"><strong>Je leert in deze paragraaf:</strong>
        <ul>
          <li>wat termen en gelijksoortige termen zijn</li>
          <li>hoe je gelijksoortige termen samenvoegt tot een kortere formule</li>
        </ul>
      </div>
      <div class="theorie"><strong>Theorie</strong>
        <p>Een <strong>term</strong> is een deel van een formule, gescheiden door + of −. Voorbeeld: in <span class="formula">4a + 7a + 3b</span> zijn 4a, 7a en 3b de drie termen.</p>
        <p>Termen die <strong>dezelfde letter</strong> bevatten heten <strong>gelijksoortige termen</strong>. Die mag je samenvoegen door de getallen vóór de letter (de coëfficiënten) bij elkaar op te tellen of af te trekken.</p>
        <p>Termen met <em>verschillende</em> letters of <em>losse getallen</em> mag je NIET samenvoegen.</p>
      </div>
      <div class="stappen"><strong>Aanpak: samenvoegen</strong><ol>
        <li>Streep gelijksoortige termen aan met dezelfde kleur (in je hoofd of op papier).</li>
        <li>Tel de coëfficiënten van elke groep op (let op + of −).</li>
        <li>Zet termen met andere letters of losse getallen ongewijzigd erbij.</li>
      </ol></div>
      <div class="voorbeeld"><strong>Voorbeeld 1</strong><br>
        <span class="stap">Formule: <span class="formula">4a + 7a</span></span>
        <span class="stap">Beide hebben letter <em>a</em>, dus gelijksoortig.</span>
        <span class="stap">Coëfficiënten: 4 + 7 = 11.</span>
        <span class="stap">Antwoord: <span class="formula">11a</span></span>
      </div>
      <div class="voorbeeld"><strong>Voorbeeld 2</strong><br>
        <span class="stap">Formule: <span class="formula">5x + 3y + 2x</span></span>
        <span class="stap">x bij x: 5x + 2x = 7x. y blijft alleen.</span>
        <span class="stap">Antwoord: <span class="formula">7x + 3y</span></span>
      </div>
      <div class="voorbeeld"><strong>Voorbeeld 3 (met los getal)</strong><br>
        <span class="stap">Formule: <span class="formula">6p + 4 + 3p</span></span>
        <span class="stap">p bij p: 6p + 3p = 9p. De 4 blijft los.</span>
        <span class="stap">Antwoord: <span class="formula">9p + 4</span></span>
      </div>
      <div class="tip"><strong>Notatie-tip:</strong> <span class="formula">1 × a</span> schrijf je als <span class="formula">a</span> (de 1 laat je weg). En <span class="formula">4 × a</span> schrijf je als <span class="formula">4a</span> (kort, geen × ertussen).</div>
      <div class="fout"><strong>Veelgemaakte fout:</strong> 5x en 3y zijn NIET gelijksoortig (verschillende letters). 5x + 3y kun je dus NIET korter schrijven dan 5x + 3y.</div>
    `,
    opgaven: [
      {
        titel: 'Opgave 1 - De vlaggetjeslijn van Eline',
        intro: `<p>Eline hangt een vlaggetjeslijn op voor een feest. Elk vlaggetje heeft een breedte van <span class="formula">v</span> cm en tussen twee vlaggetjes zit een stuk lijn van <span class="formula">a</span> cm.</p>
        <div class="figuur">[ lijn — vlag — lijn — vlag — lijn — vlag — lijn — vlag — lijn — vlag — lijn ]<br>(5 vlaggetjes, 6 stukken lijn ertussen + aan de uiteinden)</div>`,
        sub: [
          { label: 'a',
            vraag: 'In de tekening hangen 5 vlaggetjes. Aan elke kant zit ook nog een stuk lijn. Hoeveel stukken lijn zijn er in totaal (de tussenstukken + de uiteinden)?',
            antwoord: '6',
            hint: 'Tel: lijn-vlag-lijn-vlag-...-lijn. 5 vlaggetjes → hoeveel lijntjes?',
            uitleg: 'Bij 5 vlaggetjes met een stuk lijn aan elke kant zijn er 6 stukken lijn (4 tussen de vlaggetjes + 2 aan de uiteinden).' },
          { label: 'b',
            vraag: 'Vul nu de juiste getallen in. Voor de totale lengte van de slinger in de tekening geldt: ___ × v + ___ × a = totale lengte. Antwoord beknopt, zonder spaties.',
            antwoord: '5v+6a', alts: ['5v+6a','5v + 6a','6a+5v','6a + 5v','5×v+6×a'],
            hint: '5 vlaggetjes geven 5v. 6 stukken lijn geven 6a.',
            uitleg: '5 vlaggetjes × v cm + 6 stukken lijn × a cm. Totaal: 5v + 6a.' },
          { label: 'c',
            vraag: 'Eline maakt nu een veel langere slinger met in totaal 36 vlaggetjes. Met een stuk lijn aan elke kant: hoeveel stukken lijn zitten er dan in totaal?',
            antwoord: '37',

          { label: 'd',
            vraag: 'Stel: de vlaggetjes zijn 8 cm breed (v = 8) en de stukken lijn zijn 12 cm (a = 12). Hoeveel cm is de hele slinger van 36 vlaggetjes lang? Gebruik je formule 36v + 37a.',

          { label: 'a',

// STATE & STORAGE

const STORAGE_KEY = 'wiskunde_trainer_v3';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { moduleScores: {}, moduleAnswers: {}, testScores: {}, testAnswers: {} };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();if (!state.moduleAnswers) state.moduleAnswers = {};
let view = { screen: 'home', moduleId: null, testId: null, qIndex: 0, tab: 'uitleg', selected: null, checked: false, hint: false, testInputs: {} };

function normalize(s) {
  return String(s).toLowerCase()
    .replace(/\s+/g,'')
    .replace(/×/g,'')
    .replace(/\*/g,'')
    .replace(/·/g,'')
    .replace(/−/g,'-')
    .replace(/,/g,'.');
}
function checkAnswer(input, vraag) {
  const norm = normalize(input);
  if (vraag.alts && vraag.alts.length) {
    return vraag.alts.some(a => normalize(a) === norm);
  }
  return normalize(vraag.antwoord) === norm;
}
function getModuleProgress(mId) {
  const s = state.moduleScores[mId] || {};
  const m = MODULES.find(x => x.id === mId);
  const total = m.vragen.length;
  const done = Object.keys(s).length;
  const correct = Object.values(s).filter(x => x).length;
  return { total, done, correct };
}
function getTotalProgress() {
  let totalQ = 0, totalC = 0;
  MODULES.forEach(m => {
    const p = getModuleProgress(m.id);
    totalQ += p.total;
    totalC += p.correct;
  });
  return { totalQ, totalC };
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const app = document.getElementById('app');
  if (view.screen === 'home') app.innerHTML = renderHome();
  else if (view.screen === 'module') app.innerHTML = renderModule();
  else if (view.screen === 'test') app.innerHTML = renderTest();
  else if (view.screen === 'testResult') app.innerHTML = renderTestResult();
  attachListeners();
}

function renderHome() {
  const tp = getTotalProgress();
  const pct = tp.totalQ ? Math.round((tp.totalC / tp.totalQ) * 100) : 0;
  let html = `
    <header>
      <h1>Wiskunde Trainer</h1>
      <p>Hoofdstuk 8 (Vergelijkingen) en Hoofdstuk 10 (Verbanden)</p>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="progress-text">${tp.totalC} van ${tp.totalQ} sub-vragen goed (${pct}%)</div>
    </header>
    <div class="card">
      <h2>Modules met uitleg + oefenen</h2>
      <p style="font-size:13px;color:#64748b;margin-bottom:14px;">Elke module heeft eerst een uitgebreide uitleg in boekstijl, daarna verhalende opgaven met sub-vragen a, b, c, d.</p>
      <div class="module-grid">
  `;
  MODULES.forEach(m => {
    const p = getModuleProgress(m.id);
    const pct2 = p.total ? (p.correct / p.total) * 100 : 0;
    html += `
      <button class="module-card" data-action="openModule" data-id="${m.id}">
        <div class="num">${m.id}</div>
        <div class="chapter">${m.chapter}</div>
        <div class="title">${m.title}</div>
        <div class="mini-progress"><div style="width:${pct2}%"></div></div>
        <div class="stats">${p.correct}/${p.total} goed</div>
      </button>
    `;
  });
  html += `</div></div>
    <div class="card">
      <h2>Oefenproefwerken</h2>
      <p style="font-size:14px;color:#64748b;margin-bottom:14px;">Doe deze pas als je de modules hebt geoefend.</p>
      <div class="test-grid">
  `;
  PROEFWERKEN.forEach(t => {
    const score = state.testScores[t.id];
    html += `
      <button class="test-card" data-action="openTest" data-id="${t.id}">
        <div class="title">${t.title}</div>
        <div class="score">${score !== undefined ? 'Score: ' + score + '/' + t.vragen.length : 'Niet gemaakt'}</div>
      </button>
    `;
  });
  html += `</div></div>
    <div class="reset-link">
      <button data-action="reset">Voortgang wissen</button>

  return html;
}

function renderModule() {
  const m = MODULES.find(x => x.id === view.moduleId);
  const p = getModuleProgress(m.id);
  let html = `
    <button class="back-btn" data-action="home">&larr; Terug naar overzicht</button>
    <div class="card">
      <div style="color:#94a3b8;font-size:12px;">${m.chapter}</div>
      <h2 style="margin-top:4px;">${m.title}</h2>
      <p style="color:#64748b;font-size:14px;margin-bottom:12px;">${m.desc}</p>
      <div class="tabs">
        <button class="tab ${view.tab === 'uitleg' ? 'active':''}" data-action="tab" data-tab="uitleg">Uitleg</button>
        <button class="tab ${view.tab === 'oefenen' ? 'active':''}" data-action="tab" data-tab="oefenen">Oefenen (${p.correct}/${p.total})</button>
      </div>
  `;
  if (view.tab === 'uitleg') {
    html += `<div class="uitleg-content">${m.uitleg}</div>
      <div class="btn-row"><button class="btn" data-action="tab" data-tab="oefenen">Start met oefenen</button></div>
    `;
  } else {
    html += renderQuestion(m);
  }
  html += `</div>`;
  return html;
}

function renderPrevSubvragen(m, currentIdx) {
  const v = m.vragen[currentIdx];
  const prev = [];
  for (let i = 0; i < currentIdx; i++) {
    if (m.vragen[i].opgaveNr === v.opgaveNr) prev.push({ idx: i, v: m.vragen[i] });
  }
  if (!prev.length) return '';
  const answers = state.moduleAnswers[m.id] || {};
  const scores = state.moduleScores[m.id] || {};
  let html = '<div class="prev-answers"><div style="font-weight:600;color:#6b21a8;margin-bottom:4px;font-size:12px;">Wat je al hebt gedaan in deze opgave:</div>';
  prev.forEach(function(item) {
    const idx = item.idx, pv = item.v;
    const ans = answers[idx];
    const correct = scores[idx];
    const correctAns = pv.type === 'mc' ? (pv.opties[pv.juist]) : pv.antwoord;
    const userDisplay = pv.type === 'mc' ? (ans !== undefined && ans !== null ? pv.opties[Number(ans)] : '?') : (ans || '?');
    const cls = correct === true ? 'correct' : correct === false ? 'wrong' : '';
    html += `<div class="pa-item ${cls}"><span class="lbl">${pv.label})</span>`;
    if (cls === 'correct') {
      html += `<span class="ans">${escapeHtml(String(userDisplay))}</span>`;
    } else if (cls === 'wrong') {
      html += `<span class="ans">${escapeHtml(String(userDisplay))}</span><span class="correct-ans">→ ${escapeHtml(String(correctAns))}</span>`;
    } else {
      html += `<span style="color:#94a3b8;">(nog niet beantwoord)</span>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

function renderQuestion(m) {
  const idx = view.qIndex;
  const v = m.vragen[idx];
  const isMC = v.type === 'mc';
  let html = `
    <div class="opgave-header">
      <div class="label">${v.opgaveTitel}</div>
      <div class="opgave-intro">${v.intro}</div>
    </div>
    ${renderPrevSubvragen(m, idx)}
    <div class="question-card">
      <div class="question-counter">Vraag ${idx + 1} van ${m.vragen.length}</div>
      <div class="sub-vraag-label">${v.label})</div>
      <div class="question-text">${v.vraag}</div>
  `;
  if (isMC) {
    html += `<div class="mc-options">`;
    v.opties.forEach((opt, i) => {
      let cls = 'mc-option';
      if (view.checked) {
        if (i === v.juist) cls += ' correct';
        else if (i === view.selected) cls += ' wrong';
      } else if (view.selected === i) cls += ' selected';
      html += `<button class="${cls}" data-action="selectMC" data-idx="${i}" ${view.checked ? 'disabled' : ''}>${escapeHtml(opt)}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<input class="answer-input" id="answerInput" type="text" placeholder="Typ je antwoord" value="${view.selected ?? ''}" ${view.checked ? 'disabled' : ''} autocomplete="off">`;
  }

  if (view.hint) {
    html += `<div class="hint-box"><strong>Hint:</strong> ${v.hint || 'Geen hint beschikbaar.'}</div>`;
  }

  if (view.checked) {
    const correct = view.lastCorrect;
    html += `<div class="feedback ${correct ? 'correct' : 'wrong'}">
      <strong>${correct ? 'Goed!' : 'Niet helemaal.'}</strong>
      ${correct ? '' : `<div class="answer-shown">Juiste antwoord: <strong>${escapeHtml(v.antwoord || v.opties[v.juist])}</strong></div>`}
      <div>${v.uitleg || ''}</div>
    </div>`;
  }

  html += `<div class="btn-row">`;
  if (!view.checked) {
    html += `<button class="btn" data-action="check">Controleer</button>`;
    if (!view.hint) html += `<button class="btn btn-secondary btn-small" data-action="hint">Hint</button>`;
  } else {
    if (idx < m.vragen.length - 1) html += `<button class="btn" data-action="next">Volgende</button>`;
    else html += `<button class="btn" data-action="home">Klaar! terug naar overzicht</button>`;
    html += `<button class="btn btn-secondary btn-small" data-action="retry">Opnieuw</button>`;
  }
  if (idx > 0 && !view.checked) html += `<button class="btn btn-secondary btn-small" data-action="prev">Vorige</button>`;
  html += `</div></div>`;
  return html;
}

      html += `<div class="opgave-header" style="margin-top:18px;">
        <div class="label">${v.opgaveTitel}</div>
        <div class="opgave-intro">${v.intro || ''}</div>
      </div>`;
      lastOpgave = v.opgaveNr;
    }
    html += `<div class="question-card" style="margin-bottom:12px;">
      <div class="sub-vraag-label">${v.label})</div>
      <div class="question-text" style="font-size:15px;text-align:left;">${v.vraag}</div>`;
    if (isMC) {
      html += `<div class="mc-options">`;
      v.opties.forEach((opt, oi) => {
        const sel = view.testInputs[i] === String(oi);
        html += `<button class="mc-option ${sel ? 'selected':''}" data-action="testMC" data-q="${i}" data-i="${oi}">${escapeHtml(opt)}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<input class="answer-input" type="text" data-action="testInput" data-q="${i}" placeholder="Antwoord" value="${view.testInputs[i] || ''}" autocomplete="off">`;
    }
    html += `</div>`;
  });
  html += `<div class="btn-row"><button class="btn" data-action="submitTest">Lever in</button></div>`;
  html += `</div>`;
  return html;
}

function renderTestResult() {
  const t = PROEFWERKEN.find(x => x.id === view.testId);
  const answers = state.testAnswers[t.id] || [];
  let score = 0;
  t.vragen.forEach((v, i) => {
    if (v.type === 'mc') {
      if (String(v.juist) === answers[i]) score++;
    } else {
      if (answers[i] && checkAnswer(answers[i], v)) score++;
    }
  });
  const grade = Math.round((score / t.vragen.length) * 10 * 10) / 10;
  const gradeClass = grade >= 7 ? 'good' : grade >= 5.5 ? 'mid' : 'low';
  const msg = grade >= 8 ? 'Top gedaan! je beheerst de stof.' : grade >= 6.5 ? 'Goed bezig! kijk welke je nog kan verbeteren.' : grade >= 5.5 ? 'Bijna voldoende. oefen de modules waar je vragen mist.' : 'Niet erg. terug naar de module-uitleg en opnieuw.';
  let html = `
    <button class="back-btn" data-action="home">&larr; Terug naar overzicht</button>
    <div class="card">
      <h2>${t.title}</h2>
      <div class="test-result">
        <div style="font-size:14px;color:#64748b;">Je score</div>
        <div class="grade ${gradeClass}">${grade}</div>
        <div style="font-size:14px;color:#64748b;">${score} van ${t.vragen.length} goed</div>
        <div class="msg">${msg}</div>
      </div>
      <h3>Overzicht van alle vragen</h3>
  `;
  t.vragen.forEach((v, i) => {
    const userAns = answers[i] || '(leeg)';
    let correct = false;
    let userDisplay = userAns;
    if (v.type === 'mc') {
      correct = String(v.juist) === answers[i];
      userDisplay = answers[i] !== undefined && answers[i] !== '' ? v.opties[Number(answers[i])] : '(leeg)';
    } else {
      correct = answers[i] && checkAnswer(answers[i], v);
    }
    const juistDisplay = v.type === 'mc' ? v.opties[v.juist] : v.antwoord;
    html += `<div class="review-item ${correct ? '':'wrong'}">
      <div class="q">${v.opgaveTitel} - ${v.label}) ${v.vraag}</div>
      <div class="a">Jouw antwoord: <strong>${escapeHtml(userDisplay)}</strong>${correct ? '' : ` | Juist: <strong>${escapeHtml(juistDisplay)}</strong>`}</div>
      ${!correct && v.uitleg ? `<div class="a" style="margin-top:4px;font-style:italic;">${v.uitleg}</div>` : ''}
    </div>`;
  });
  html += `<div class="btn-row">
    <button class="btn" data-action="retakeTest">Probeer opnieuw</button>
    <button class="btn btn-secondary" data-action="home">Terug naar overzicht</button>
  </div></div>`;
  return html;
}

function attachListeners() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleClick);
  });
  document.querySelectorAll('input[data-action="testInput"]').forEach(el => {
    el.addEventListener('input', e => {
      const q = Number(e.target.dataset.q);
      view.testInputs[q] = e.target.value;
    });
  });
  const ai = document.getElementById('answerInput');
  if (ai) {
    ai.focus();
    ai.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (!view.checked) doCheck();
        else doNext();
      }
    });
    ai.addEventListener('input', e => { view.selected = e.target.value; });
  }
}

function handleClick(e) {
  const a = e.currentTarget.dataset.action;
  if (a === 'home') goHome();
  else if (a === 'openModule') openModule(Number(e.currentTarget.dataset.id));
  else if (a === 'openTest') openTest(Number(e.currentTarget.dataset.id));
  else if (a === 'tab') { view.tab = e.currentTarget.dataset.tab; view.qIndex = 0; resetQState(); render(); }
  else if (a === 'check') doCheck();
  else if (a === 'next') doNext();
  else if (a === 'prev') doPrev();
  else if (a === 'retry') { resetQState(); render(); }
  else if (a === 'hint') { view.hint = true; render(); }
  else if (a === 'selectMC') { view.selected = Number(e.currentTarget.dataset.idx); render(); }
  else if (a === 'testMC') { view.testInputs[Number(e.currentTarget.dataset.q)] = e.currentTarget.dataset.i; render(); }
  else if (a === 'submitTest') submitTest();
  else if (a === 'retakeTest') openTest(view.testId);
  else if (a === 'reset') doReset();
}

function resetQState() {
  view.selected = null;
  view.checked = false;
  view.hint = false;
  view.lastCorrect = false;
}
function goHome() { view.screen = 'home'; render(); }
function openModule(id) {
  view.screen = 'module';
  view.moduleId = id;
  view.tab = 'uitleg';
  view.qIndex = 0;
  resetQState();
  render();
}
function openTest(id) {
  view.screen = 'test';
  view.testId = id;
  view.testInputs = {};
  render();
}
function doCheck() {
  const m = MODULES.find(x => x.id === view.moduleId);
  const v = m.vragen[view.qIndex];
  let correct = false;
  if (v.type === 'mc') {
    if (view.selected === null) return;
    correct = view.selected === v.juist;
  } else {
    if (view.selected === null || String(view.selected).trim() === '') return;
    correct = checkAnswer(view.selected, v);
  }
  view.checked = true;
  view.lastCorrect = correct;
  if (!state.moduleScores[m.id]) state.moduleScores[m.id] = {};
  if (!state.moduleAnswers[m.id]) state.moduleAnswers[m.id] = {};
  state.moduleScores[m.id][view.qIndex] = correct;
  state.moduleAnswers[m.id][view.qIndex] = view.selected;
  saveState();
  render();
}
function doNext() {
  const m = MODULES.find(x => x.id === view.moduleId);
  if (view.qIndex < m.vragen.length - 1) {
    view.qIndex++;
    resetQState();
    render();
  }
}
function doPrev() {
  if (view.qIndex > 0) {
    view.qIndex--;
    resetQState();
    render();
  }
}
function submitTest() {
  const t = PROEFWERKEN.find(x => x.id === view.testId);
  const answers = [];
  t.vragen.forEach((v, i) => { answers[i] = view.testInputs[i] || ''; });
  state.testAnswers[t.id] = answers;
  let score = 0;
  t.vragen.forEach((v, i) => {
    if (v.type === 'mc') {
      if (String(v.juist) === answers[i]) score++;
    } else {
      if (answers[i] && checkAnswer(answers[i], v)) score++;
    }
  });
  state.testScores[t.id] = score;
  saveState();
  view.screen = 'testResult';
  render();
}
function doReset() {
  if (confirm('Weet je het zeker? Alle voortgang wordt gewist.')) {
    state = { moduleScores: {}, moduleAnswers: {}, testScores: {}, testAnswers: {} };
    saveState();
    render();
  }
}

try { render(); } catch(e) {
  var box = document.getElementById('errorBox');
  if (box) { box.style.display = 'block'; box.textContent = 'INIT ERROR: ' + e.message + '\n\n' + (e.stack || ''); }
}
</script>
</body>
</html>
